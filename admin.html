<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chronicle AI Creator Studio</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>Chronicle AI</span></a><a class="admin-link" href="index.html">View site</a></header><main class="section-shell" style="padding:8rem 1rem 4rem"><section id="loginPanel" class="creator-panel"><div><span class="section-kicker">PRIVATE</span><h1>Creator Studio</h1><p>Sign in to upload and publish historical films.</p></div><form id="loginForm" class="creator-form"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="primary-button">Sign in</button><p id="loginStatus"></p></form></section><section id="studioPanel" hidden><div class="section-heading-row"><div><span class="section-kicker">CREATOR STUDIO</span><h1>New production</h1></div><button id="signOut" class="secondary-button">Sign out</button></div><form id="filmForm" class="creator-form"><label>Title<input name="title" required></label><label>Slug<input name="slug" placeholder="gettysburg-day-one" required></label><div class="two-col"><label>Historical date<input name="historical_date" placeholder="July 1, 1863"></label><label>Location<input name="location" placeholder="Gettysburg, Pennsylvania"></label></div><label>Era<input name="era" placeholder="American Civil War"></label><label>Short description<textarea name="description" rows="4" required></textarea></label><label>Historical context<textarea name="historical_context" rows="6"></textarea></label><label>Sources<textarea name="sources" rows="6" placeholder="One source per line"></textarea></label><label>Thumbnail image<input name="thumbnail" type="file" accept="image/*" required></label><label>Video file<input name="video" type="file" accept="video/*"
